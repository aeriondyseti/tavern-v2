name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run knip
      - run: bun run arch
      - run: bun run test

  publish:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Apply dev version suffix
        if: github.ref == 'refs/heads/dev'
        run: |
          BASE=$(node -p "require('./apps/server/package.json').version")
          DEV_VERSION="${BASE}-dev.${GITHUB_RUN_NUMBER}"
          (cd apps/server && npm version --no-git-tag-version "${DEV_VERSION}")
          echo "PUBLISH_TAG=dev" >> "$GITHUB_ENV"
          echo "PUBLISH_VERSION=${DEV_VERSION}" >> "$GITHUB_ENV"

      - name: Set latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(node -p "require('./apps/server/package.json').version")
          echo "PUBLISH_TAG=latest" >> "$GITHUB_ENV"
          echo "PUBLISH_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd apps/server
          npm publish --tag "${PUBLISH_TAG}"

      - name: Tag release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${PUBLISH_VERSION}"
          git push origin "v${PUBLISH_VERSION}"
          gh release create "v${PUBLISH_VERSION}" --generate-notes

      - name: Reset dev to main (main)
        if: github.ref == 'refs/heads/main'
        run: |
          git push origin "HEAD:dev" --force
