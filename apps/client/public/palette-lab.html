<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tavern Palette Lab</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        background: #09090b;
        color: #e4e4e7;
        padding: 24px;
        min-height: 100vh;
      }
      h1,
      h2,
      h3,
      h4 {
        font-family: ui-serif, Georgia, "Times New Roman", serif;
      }
      code,
      .mono {
        font-family: ui-monospace, "JetBrains Mono", "Fira Code", monospace;
      }

      .lab-header {
        text-align: center;
        padding: 12px 0 8px;
        font-family: ui-serif, Georgia, serif;
        color: #fac679;
        font-size: 22px;
        letter-spacing: 0.05em;
      }
      .lab-subtitle {
        text-align: center;
        color: #a1a1aa;
        font-style: italic;
        margin-bottom: 24px;
        font-size: 13px;
      }

      /* Side-by-side panels */
      .panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        max-width: 1600px;
        margin: 0 auto;
      }
      .panel {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        overflow: hidden;
      }
      .panel-label {
        text-align: center;
        padding: 10px;
        font-family: ui-serif, Georgia, serif;
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        background: #0b0b0e;
        color: #a1a1aa;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .panel-body {
        padding: 24px;
      }

      /* Swatch grid */
      .swatch-section {
        margin-bottom: 22px;
      }
      .swatch-section h3 {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        margin-bottom: 8px;
        font-family: ui-serif, Georgia, serif;
        font-weight: 400;
      }
      .swatches {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 6px;
      }
      .swatch {
        border-radius: 3px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.06);
        cursor: pointer;
        transition: transform 150ms ease;
      }
      .swatch:hover {
        transform: translateY(-1px);
      }
      .swatch-color {
        height: 40px;
      }
      .swatch-info {
        padding: 5px 7px;
        font-size: 10px;
        font-family: ui-monospace, monospace;
      }
      .swatch-name {
        display: block;
        margin-bottom: 1px;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 600;
      }
      .swatch-hex {
        opacity: 0.7;
      }

      /* Mini UI preview */
      .preview {
        border-radius: 3px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 12px;
      }
      .preview-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        border-bottom: 1px solid;
      }
      .preview-brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .preview-brand-name {
        font-family: ui-serif, Georgia, serif;
        font-size: 13px;
      }
      .preview-nav {
        display: flex;
        gap: 8px;
      }
      .preview-nav-link {
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 2px 6px;
      }
      .preview-nav-link.active {
        border-bottom: 1px solid;
      }
      .preview-status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 9px;
      }
      .preview-kbd {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 5px;
        border: 1px solid;
        border-radius: 2px;
        font-family: ui-monospace, monospace;
      }
      .preview-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }

      .preview-body {
        display: grid;
        grid-template-columns: 140px 1fr;
        min-height: 280px;
      }

      .preview-sidebar {
        border-right: 1px solid;
        padding: 0;
        backdrop-filter: blur(8px);
      }
      .preview-sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        border-bottom: 1px solid;
      }
      .preview-sidebar-title {
        font-family: ui-serif, Georgia, serif;
        font-size: 12px;
      }
      .preview-icon-btn {
        width: 22px;
        height: 22px;
        border: 1px solid;
        border-radius: 2px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .preview-icon-btn svg {
        width: 11px;
        height: 11px;
      }
      .preview-list-item {
        padding: 8px 10px;
        border-bottom: 1px solid;
        font-size: 11px;
      }
      .preview-list-item.active {
        background: rgba(255, 255, 255, 0.04);
      }
      .preview-list-item-meta {
        font-size: 9px;
        opacity: 0.7;
        margin-top: 2px;
      }

      .preview-content {
        padding: 14px 16px;
        position: relative;
      }
      .preview-section-title {
        font-family: ui-serif, Georgia, serif;
        font-size: 13px;
        margin-bottom: 8px;
      }
      .preview-section {
        padding: 12px 14px;
        border: 1px solid;
        border-radius: 2px;
        margin-bottom: 12px;
      }
      .preview-field {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        font-size: 11px;
      }
      .preview-field:last-child {
        margin-bottom: 0;
      }
      .preview-field-label {
        width: 78px;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .preview-input {
        flex: 1;
        padding: 4px 6px;
        border: 1px solid;
        border-radius: 2px;
        font-size: 11px;
      }
      .preview-row {
        display: flex;
        gap: 6px;
      }
      .preview-btn {
        padding: 4px 10px;
        font-size: 10px;
        border: 1px solid;
        border-radius: 2px;
        cursor: pointer;
      }

      .preview-footer {
        position: sticky;
        bottom: 0;
        margin: 0 -16px -14px;
        padding: 10px 16px;
        border-top: 1px solid;
        display: flex;
        align-items: center;
        gap: 10px;
        backdrop-filter: blur(8px);
      }
      .preview-footer-revert,
      .preview-footer-status {
        font-size: 10px;
      }

      /* Editor */
      .editor-section {
        margin-top: 30px;
        padding-top: 22px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        max-width: 1600px;
        margin-left: auto;
        margin-right: auto;
      }
      .editor-title {
        font-family: ui-serif, Georgia, serif;
        font-size: 14px;
        color: #fac679;
        text-align: center;
        margin-bottom: 14px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .editor-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 6px;
      }
      .editor-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 8px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 3px;
      }
      .editor-row label {
        font-size: 11px;
        font-family: ui-monospace, monospace;
        color: #a1a1aa;
        min-width: 110px;
        flex-shrink: 0;
      }
      .editor-row input[type="color"] {
        width: 26px;
        height: 26px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 2px;
        cursor: pointer;
        background: none;
        padding: 1px;
      }
      .editor-row .hex-display {
        font-size: 10px;
        font-family: ui-monospace, monospace;
        color: #a1a1aa;
        min-width: 56px;
      }
      .editor-row input[type="range"] {
        flex: 1;
        max-width: 80px;
      }
      .editor-row .alpha-display {
        font-size: 10px;
        font-family: ui-monospace, monospace;
        color: #a1a1aa;
        min-width: 28px;
      }

      .actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 22px auto 0;
      }
      .action-btn {
        padding: 7px 16px;
        font-family: ui-serif, Georgia, serif;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        background: rgba(250, 198, 121, 0.1);
        color: #fac679;
        border: 1px solid rgba(250, 198, 121, 0.4);
        border-radius: 2px;
        cursor: pointer;
        transition: background 200ms ease;
      }
      .action-btn:hover {
        background: rgba(250, 198, 121, 0.2);
      }
      .action-btn.secondary {
        background: rgba(255, 255, 255, 0.04);
        color: #e4e4e7;
        border-color: rgba(255, 255, 255, 0.12);
      }
      .action-btn.secondary:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: #18181b;
        color: #fac679;
        padding: 9px 22px;
        border-radius: 3px;
        font-size: 12px;
        font-family: ui-monospace, monospace;
        border: 1px solid rgba(250, 198, 121, 0.4);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        z-index: 100;
      }
      .toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="lab-header">Tavern Palette Lab</div>
    <div class="lab-subtitle">
      Click any swatch to copy its hex. Edit colors below — previews update live. Inspired by
      <a href="https://github.com/RivelleDays/SillyTavern-MoonlitEchoesTheme" style="color: #51a0de">Moonlit Echoes</a>.
    </div>

    <div class="panels" id="panels"></div>

    <div class="editor-section">
      <div class="editor-title">Color Editor</div>
      <div class="editor-grid" id="editor-grid"></div>
      <div class="actions">
        <button class="action-btn" onclick="exportCSS()">Copy @theme block</button>
        <button class="action-btn secondary" onclick="resetEdit()">Reset to baseline</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      // The current Moonlit (cool) palette as defined in apps/client/src/index.css.
      const baseline = {
        app: "#0b0b0e",
        // panel and elevated are colors plus alpha (composited at render time).
        "panel-base": "#18181b",
        "panel-alpha": 0.65,
        "elevated-base": "#27272a",
        "elevated-alpha": 0.75,
        "line-base": "#ffffff",
        "line-alpha": 0.06,
        "line-strong-base": "#ffffff",
        "line-strong-alpha": 0.12,
        ink: "#e4e4e7",
        "ink-muted": "#a1a1aa",
        "ink-faint": "#71717a",
        glow: "#fac679",
        pool: "#51a0de",
        ember: "#e53935",
        moss: "#9ccc65",
      };

      // Mutable working copy.
      let edit = JSON.parse(JSON.stringify(baseline));

      // ── Helpers ──
      function hexToRgb(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return [r, g, b];
      }
      function rgba(hex, a) {
        const [r, g, b] = hexToRgb(hex);
        return `rgba(${r}, ${g}, ${b}, ${a})`;
      }
      function isLight(hex) {
        const [r, g, b] = hexToRgb(hex);
        return (r * 299 + g * 587 + b * 114) / 1000 > 128;
      }
      function resolved(p) {
        return {
          app: p.app,
          panel: rgba(p["panel-base"], p["panel-alpha"]),
          elevated: rgba(p["elevated-base"], p["elevated-alpha"]),
          line: rgba(p["line-base"], p["line-alpha"]),
          lineStrong: rgba(p["line-strong-base"], p["line-strong-alpha"]),
          ink: p.ink,
          inkMuted: p["ink-muted"],
          inkFaint: p["ink-faint"],
          glow: p.glow,
          pool: p.pool,
          ember: p.ember,
          moss: p.moss,
        };
      }

      // ── Swatch ──
      function swatch(name, value, p) {
        const c = resolved(p);
        return `<div class="swatch" data-hex="${value}">
        <div class="swatch-color" style="background: ${value};"></div>
        <div class="swatch-info" style="background: ${c.elevated}; color: ${c.inkMuted};">
          <span class="swatch-name" style="color: ${c.ink};">${name}</span>
          <span class="swatch-hex">${value}</span>
        </div>
      </div>`;
      }

      // ── Mini UI preview ──
      function previewHTML(p) {
        const c = resolved(p);
        return `<div class="preview" style="background: ${c.app}; color: ${c.ink};">
        <div class="preview-header" style="background: ${c.app}; border-color: ${c.line};">
          <div class="preview-brand">
            <span class="preview-brand-name" style="color: ${c.ink};">Tavern</span>
            <div class="preview-nav">
              <span class="preview-nav-link active" style="color: ${c.ink}; border-color: ${c.ink};">Play</span>
              <span class="preview-nav-link" style="color: ${c.inkFaint};">Catalog</span>
              <span class="preview-nav-link" style="color: ${c.inkFaint};">Settings</span>
            </div>
          </div>
          <div class="preview-status">
            <span class="preview-kbd" style="color: ${c.inkMuted}; border-color: ${c.line};">
              <span>Ctrl-K</span><span style="color: ${c.inkFaint};">switch story</span>
            </span>
            <span class="preview-dot" style="background: ${c.moss};" title="server ok"></span>
          </div>
        </div>

        <div class="preview-body">
          <aside class="preview-sidebar" style="background: ${c.panel}; border-color: ${c.line};">
            <div class="preview-sidebar-header" style="border-color: ${c.line};">
              <span class="preview-sidebar-title" style="color: ${c.ink};">Stories</span>
              <button class="preview-icon-btn" aria-label="new story" style="background: rgba(255,255,255,0.04); border-color: ${c.lineStrong}; color: ${c.inkMuted};">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
              </button>
            </div>
            <div class="preview-list-item active" style="color: ${c.ink}; border-color: ${c.line};">
              The Hollow Crown
              <div class="preview-list-item-meta" style="color: ${c.inkFaint};">3 scenes</div>
            </div>
            <div class="preview-list-item" style="color: ${c.inkMuted}; border-color: ${c.line};">
              Echo of Mira
              <div class="preview-list-item-meta" style="color: ${c.inkFaint};">1 scene</div>
            </div>
            <div class="preview-list-item" style="color: ${c.inkMuted}; border-color: ${c.line};">
              Salt &amp; Star
              <div class="preview-list-item-meta" style="color: ${c.inkFaint};">5 scenes</div>
            </div>
          </aside>

          <div class="preview-content" style="color: ${c.ink};">
            <div class="preview-section-title" style="color: ${c.ink};">Defaults</div>
            <div class="preview-section" style="background: ${c.panel}; border-color: ${c.line};">
              <div class="preview-field">
                <span class="preview-field-label" style="color: ${c.inkMuted};">Model</span>
                <span class="preview-input" style="background: ${rgba(p.app, 0.7)}; border-color: ${c.line}; color: ${c.ink};">claude-opus-4-7</span>
              </div>
              <div class="preview-field">
                <span class="preview-field-label" style="color: ${c.inkMuted};">Temp</span>
                <span class="preview-input" style="background: ${rgba(p.app, 0.7)}; border-color: ${c.line}; color: ${c.ink};">1.0</span>
              </div>
            </div>

            <div class="preview-section-title" style="color: ${c.ink};">Storage</div>
            <div class="preview-section" style="background: ${c.panel}; border-color: ${c.line};">
              <div class="preview-field">
                <span class="preview-field-label" style="color: ${c.inkMuted};">Backup</span>
                <button class="preview-btn" style="background: ${rgba(p.glow, 0.1)}; border-color: ${rgba(p.glow, 0.4)}; color: ${c.glow};">download</button>
              </div>
              <div class="preview-field">
                <span class="preview-field-label" style="color: ${c.inkMuted};">Status</span>
                <span style="color: ${c.moss}; font-size: 11px;">logged in</span>
                <span style="color: ${c.pool}; font-size: 11px; font-style: italic;">"a story of moonlight"</span>
                <span style="color: ${c.ember}; font-size: 11px;">error</span>
              </div>
            </div>

            <div class="preview-footer" style="background: ${rgba(p.app, 0.9)}; border-color: ${c.line};">
              <button class="preview-btn" style="background: ${rgba(p.glow, 0.1)}; border-color: ${rgba(p.glow, 0.4)}; color: ${c.glow};">save</button>
              <span class="preview-footer-revert" style="color: ${c.inkFaint};">revert</span>
              <span class="preview-footer-status" style="color: ${c.inkFaint}; opacity: 0.7;">no changes</span>
            </div>
          </div>
        </div>
      </div>`;
      }

      // ── Render panels ──
      function renderPanels() {
        const container = document.getElementById("panels");
        container.innerHTML = "";

        [
          { key: "baseline", label: "Baseline · Moonlit cool", p: baseline },
          { key: "edit", label: "Edit · your changes", p: edit },
        ].forEach(({ key, label, p }) => {
          const c = resolved(p);
          const panel = document.createElement("div");
          panel.className = "panel";
          panel.innerHTML = `
          <div class="panel-label">${label}</div>
          <div class="panel-body" style="background: ${c.app};">

            <div class="swatch-section">
              <h3 style="color: ${c.inkFaint};">Surface</h3>
              <div class="swatches">
                ${swatch("app", p.app, p)}
                ${swatch("panel", p["panel-base"], p)}
                ${swatch("elevated", p["elevated-base"], p)}
                ${swatch("line", p["line-base"], p)}
                ${swatch("line-strong", p["line-strong-base"], p)}
              </div>
            </div>

            <div class="swatch-section">
              <h3 style="color: ${c.inkFaint};">Ink</h3>
              <div class="swatches">
                ${swatch("ink", p.ink, p)}
                ${swatch("ink-muted", p["ink-muted"], p)}
                ${swatch("ink-faint", p["ink-faint"], p)}
              </div>
            </div>

            <div class="swatch-section">
              <h3 style="color: ${c.inkFaint};">Accents</h3>
              <div class="swatches">
                ${swatch("glow", p.glow, p)}
                ${swatch("pool", p.pool, p)}
                ${swatch("moss", p.moss, p)}
                ${swatch("ember", p.ember, p)}
              </div>
            </div>

            <div class="swatch-section">
              <h3 style="color: ${c.inkFaint};">Mini UI</h3>
              ${previewHTML(p)}
            </div>
          </div>
        `;
          container.appendChild(panel);
        });

        document.querySelectorAll(".swatch").forEach((el) => {
          el.addEventListener("click", () => {
            const hex = el.dataset.hex;
            navigator.clipboard.writeText(hex);
            showToast(`Copied ${hex}`);
          });
        });
      }

      // ── Editor ──
      function renderEditor() {
        const grid = document.getElementById("editor-grid");
        grid.innerHTML = "";

        const order = [
          { key: "app", kind: "color" },
          { key: "panel-base", kind: "color", alphaKey: "panel-alpha" },
          { key: "elevated-base", kind: "color", alphaKey: "elevated-alpha" },
          { key: "line-base", kind: "color", alphaKey: "line-alpha" },
          { key: "line-strong-base", kind: "color", alphaKey: "line-strong-alpha" },
          { key: "ink", kind: "color" },
          { key: "ink-muted", kind: "color" },
          { key: "ink-faint", kind: "color" },
          { key: "glow", kind: "color" },
          { key: "pool", kind: "color" },
          { key: "moss", kind: "color" },
          { key: "ember", kind: "color" },
        ];

        order.forEach(({ key, alphaKey }) => {
          const row = document.createElement("div");
          row.className = "editor-row";
          const alphaInput = alphaKey
            ? `<input type="range" min="0" max="1" step="0.01" value="${edit[alphaKey]}" data-alpha-key="${alphaKey}" />
               <span class="alpha-display">${edit[alphaKey].toFixed(2)}</span>`
            : "";
          row.innerHTML = `
          <label>${key.replace("-base", "")}</label>
          <input type="color" value="${edit[key]}" data-key="${key}" />
          <span class="hex-display">${edit[key]}</span>
          ${alphaInput}
        `;
          const colorInput = row.querySelector('input[type="color"]');
          const display = row.querySelector(".hex-display");
          colorInput.addEventListener("input", (e) => {
            edit[key] = e.target.value;
            display.textContent = e.target.value;
            renderPanels();
          });
          if (alphaKey) {
            const alphaInputEl = row.querySelector('input[type="range"]');
            const alphaDisplay = row.querySelector(".alpha-display");
            alphaInputEl.addEventListener("input", (e) => {
              edit[alphaKey] = parseFloat(e.target.value);
              alphaDisplay.textContent = edit[alphaKey].toFixed(2);
              renderPanels();
            });
          }
          grid.appendChild(row);
        });
      }

      // ── Export ──
      function rgbSlash(hex, a) {
        const [r, g, b] = hexToRgb(hex);
        return `rgb(${r} ${g} ${b} / ${a})`;
      }
      function exportCSS() {
        const p = edit;
        const css = `@theme {
  --color-app: ${p.app};
  --color-panel: ${rgbSlash(p["panel-base"], p["panel-alpha"])};
  --color-elevated: ${rgbSlash(p["elevated-base"], p["elevated-alpha"])};
  --color-line: ${rgbSlash(p["line-base"], p["line-alpha"])};
  --color-line-strong: ${rgbSlash(p["line-strong-base"], p["line-strong-alpha"])};
  --color-ink: ${p.ink};
  --color-ink-muted: ${p["ink-muted"]};
  --color-ink-faint: ${p["ink-faint"]};
  --color-glow: ${p.glow};
  --color-pool: ${p.pool};
  --color-ember: ${p.ember};
  --color-moss: ${p.moss};
}`;
        navigator.clipboard.writeText(css);
        showToast("@theme block copied");
      }

      function resetEdit() {
        edit = JSON.parse(JSON.stringify(baseline));
        renderPanels();
        renderEditor();
        showToast("Edit reset to baseline");
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 1500);
      }

      // ── Init ──
      renderPanels();
      renderEditor();
    </script>
  </body>
</html>
